# Continuous integration for Studio Write.
#
# Starts intentionally small: typecheck, lint, and unit tests on Ubuntu so
# every PR gets fast feedback (≈1–2 min). The e2e suite (Playwright against a
# packaged Electron build) lives outside this workflow for now — it needs a
# macOS runner to mirror what we ship, which is meaningfully more expensive
# in Actions minutes. Add it as a second job (or nightly schedule) once the
# fs.watch flakes in `tests/unit/note-watcher.spec.ts` are tamed.
name: ci

on:
    pull_request:
    push:
        branches: [trunk]

# Cancel superseded runs for the same PR/branch so we don't burn minutes on
# stale commits. The most recent push wins.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: typecheck, lint, unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # `npm ci` enforces a clean install from package-lock.json — same
            # versions every run, no lockfile drift on CI.
            - name: Install dependencies
              run: npm ci

            # npm/cli#4828: when the lockfile was generated on macOS, it
            # only pins @rollup/rollup-darwin-* and `npm ci` silently skips
            # the Linux platform-specific optional dep, so vitest crashes at
            # runtime trying to require rollup's native binding. Installing
            # the Linux binary explicitly sidesteps this until the upstream
            # npm bug is fixed.
            - name: Install rollup native binding for Linux
              run: npm install --no-save @rollup/rollup-linux-x64-gnu

            - name: Typecheck
              run: npm run typecheck

            - name: Lint (JS/TS)
              run: npm run lint

            - name: Lint (CSS)
              run: npm run lint:css

            - name: Format check
              run: npm run format:check

            - name: Unit tests
              run: npm run test:unit
